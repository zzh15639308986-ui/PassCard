name: CI

# The macOS job is the only compiler available: the iOS project is authored on
# Windows and never opened in Xcode. Any change here is a change to the build.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build-and-test:
    # macOS minutes are billed at 10x. On a private repo the free tier gives
    # 2000 min/mo, i.e. roughly TWO of these runs. Keep this repo public.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Report available Xcode versions
        run: ls -d /Applications/Xcode*.app 2>/dev/null

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          swift --version

      - name: Pick an iPhone simulator
        run: |
          xcrun simctl list devices available | grep -i iphone || true
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[].value[]
                      | select(.isAvailable and (.name | test("iPhone")))]
                     | first | .udid // empty')
          if [ -z "$UDID" ]; then
            # Fallback that needs no jq: the text listing puts the UDID in
            # parentheses on the device's own line.
            UDID=$(xcrun simctl list devices available \
              | grep -i "iPhone" \
              | grep -oE "\([0-9A-Fa-f-]{36}\)" \
              | head -1 | tr -d "()")
          fi
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          xcodebuild -project PassCard.xcodeproj -list

      # Same concrete destination for build and test so the second step reuses
      # the artifacts instead of recompiling for a different target.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project PassCard.xcodeproj \
            -scheme PassCard \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PassCard.xcodeproj \
            -scheme PassCard \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    # The backend is stdlib-only Python, so it needs no macOS runner. Ubuntu
    # minutes are cheap next to macos-15, which is billed at 10x.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No ARK_API_KEY here on purpose: test_pipeline.py drives a fake client,
      # and its config selftest asserts that a missing key is rejected.
      - name: Run backend tests
        run: |
          python -m compileall -q .
          python test_pipeline.py

      # This repo is public. The real-screenshot measurement output carries a
      # passenger name, a phone tail and an order number, and an Ark key is
      # fatal if it ever lands in history, so both are checked on every push
      # instead of being left to .gitignore alone.
      - name: Check nothing secret or personal is tracked
        working-directory: .
        run: |
          set -e
          bad=$(git ls-files | grep -E '\.env$|report-real\.json|truth-real\.json|labels-real\.json' || true)
          if [ -n "$bad" ]; then
            echo "these must stay out of version control:" >&2
            echo "$bad" >&2
            exit 1
          fi
          if git grep -InE 'ark-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-'; then
            echo "an Ark API key is committed above; rotate it and purge history" >&2
            exit 1
          fi
          echo "clean: no key file, no key-shaped string, no real-screenshot data"

  sideload-ipa:
    # There is no Mac in this project, so an .ipa has to come out of CI. It is
    # deliberately UNSIGNED: Sideloadly/AltStore re-sign it on Windows with the
    # user's own free Apple ID. Signing here would need a paid certificate and
    # a provisioning profile stored as secrets, which this route avoids.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      # A device build, not a simulator build: the simulator slice cannot be
      # installed on an iPhone. Signing is switched off at every level because
      # there is no identity on the runner to sign with.
      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project PassCard.xcodeproj \
            -scheme PassCard \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee device-build.log

      - name: Assemble the .ipa
        run: |
          set -e
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name "PassCard.app" | head -1)
          if [ -z "$APP" ]; then
            echo "no PassCard.app in the device build output" >&2
            find DerivedData/Build/Products -maxdepth 2 >&2
            exit 1
          fi
          echo "packing $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # ditto rather than zip: it preserves the bundle's symlinks and
          # resource forks, which a plain zip flattens and iOS then rejects.
          ditto -c -k --sequesterRsrc --keepParent Payload PassCard-unsigned.ipa
          ls -lh PassCard-unsigned.ipa
          unzip -l PassCard-unsigned.ipa | head -20

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PassCard-unsigned-ipa
          path: PassCard-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-logs
          path: device-build.log
          if-no-files-found: ignore
          retention-days: 14
