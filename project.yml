name: PassCard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  PassCard:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: PassCardWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PassCard
        PRODUCT_NAME: PassCard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info-App.plist
      properties:
        CFBundleDisplayName: 喵卡
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 需要访问相册以选择要识别的截图。
        NSCameraUsageDescription: 需要使用相机拍摄凭证。
        # The backend is plain HTTP on a LAN address. NSAllowsLocalNetworking is
        # the sanctioned key for that; NSAllowsArbitraryLoads is here only so a
        # LAN IP cannot be blocked by an ATS edge case. DELETE IT BEFORE
        # SUBMITTING TO THE APP STORE - it requires a justification and draws
        # review attention.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true

  PassCardWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PassCard.widget
        PRODUCT_NAME: PassCardWidgetExtension
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info-Widget.plist
      properties:
        CFBundleDisplayName: 喵卡
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PassCardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PassCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PassCardTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PassCard.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PassCard"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true

schemes:
  PassCard:
    build:
      targets:
        PassCard: all
        PassCardWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PassCardTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
